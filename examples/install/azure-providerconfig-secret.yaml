# Traditional Azure ProviderConfig using a service principal stored in a
# Kubernetes Secret. Simplest to set up; least secure (long-lived secret).
# The composition's providerConfigName defaults to "default" — change
# metadata.name here only if you also override providerConfigName on the
# ControlPlane XR.
#
# Namespaced ProviderConfig in "platform": the composed managed resources are
# created in the "platform" namespace and reference this config by name within
# that namespace (kind: ProviderConfig), matching the AKS/Network building
# blocks. Use a ClusterProviderConfig only if you deploy the XR elsewhere.
apiVersion: azure.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: platform
spec:
  credentials:
    source: Secret
    # A NAMESPACED ProviderConfig resolves its credentials Secret from its OWN
    # namespace; a cross-namespace secretRef.namespace is ignored. The Secret
    # must therefore live in the same namespace as this ProviderConfig (platform)
    # — where the composed managed resources are also created. Pointing it at
    # crossplane-system yields "Secret azure-creds not found" and the MRs never
    # reconcile.
    secretRef:
      namespace: platform
      name: azure-creds
      key: credentials
