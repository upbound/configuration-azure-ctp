# Traditional Azure ProviderConfig using a service principal stored in a
# Kubernetes Secret. Simplest to set up; least secure (long-lived secret).
# The composition's providerConfigName defaults to "default" — change
# metadata.name here only if you also override providerConfigName on the
# ControlPlane XR.
#
# Namespaced ProviderConfig in "default": the composed managed resources are
# created in the "default" namespace and reference this config by name within
# that namespace (kind: ProviderConfig), matching the AKS/Network building
# blocks. Use a ClusterProviderConfig only if you deploy the XR elsewhere.
apiVersion: azure.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: azure-creds
      key: credentials
