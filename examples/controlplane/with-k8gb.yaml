# ControlPlane with the k8gb add-on enabled. Installs the k8gb operator and
# CoreDNS exposed via an Azure Standard Load Balancer serving :53, and pulls in
# nginx-ingress + cert-manager. The XR surfaces
# status.controlplane.k8gb.coreDNSEndpoint + delegationRecord for the fleet
# aggregator (FleetGslb) to consume. See docs/ctp-addons-implementation-plan.md.
apiVersion: azure.platform.upbound.io/v1alpha1
kind: ControlPlane
metadata:
  name: k8gb-control-plane
spec:
  parameters:
    id: k8gb-control-plane
    location: eastus
    version: "1.34"
    nodes:
      count: 3
      vmSize: Standard_D2s_v3
    k8gb:
      enabled: "yes"
      dnsZone: gslb.example.com
      parentZone: example.com
      strategy: failover
      # clusterGeoTag defaults to azure-<location>-<id> when omitted.
