# One persistent control plane, declared as a ControlPlane XR (the desired
# state). The provisioning pipeline loads every file in this folder; each file's
# managementMode decides its lifecycle - Provision/ObserveOnly are reconciled and
# orphaned, Full is decommissioned (deleted). Copy this file to add another.
#
# Keep `id` short/lowercase - it drives the Azure names ({id}-rg, {id}-vnet,
# {id}-sn, {id}-aks) and is how the decommission poll tracks teardown.
apiVersion: azure.platform.upbound.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp1
spec:
  parameters:
    id: azctpcp1
    # REQUIRED for the pipeline: Provision (create+adopt+update, orphan) /
    # ObserveOnly (watch, orphan) / Full (decommission - delete). Omitting it
    # defaults to Full, so a persistent control plane must set Provision.
    managementMode: Provision
    location: eastus
    version: "1.34"
    nodes:
      count: 2
      vmSize: Standard_D2s_v3
