# Composition tests for the Azure ControlPlane Python composition.
# Each test renders the composition against a ControlPlane XR fixture and
# asserts that specific composed resources are produced.
---
apiVersion: meta.dev.upbound.io/v1alpha1
kind: CompositionTest
metadata:
  name: basic
spec:
  compositionPath: apis/ctp/composition.yaml
  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: azure.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        location: eastus
        version: "1.34"
        nodes:
          count: 2
          vmSize: Standard_D2s_v3
  assertResources:
  - apiVersion: azure.m.upbound.io/v1beta1
    kind: ResourceGroup
    metadata:
      name: test-cp
  - apiVersion: network.azure.m.upbound.io/v1beta1
    kind: VirtualNetwork
    metadata:
      name: test-cp
  - apiVersion: network.azure.m.upbound.io/v1beta1
    kind: Subnet
    metadata:
      name: test-cp-aks
  - apiVersion: containerservice.azure.m.upbound.io/v1beta1
    kind: KubernetesCluster
    metadata:
      name: test-cp
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-uxp
    spec:
      forProvider:
        chart:
          version: "2.2.1-up.1"
        values:
          upbound:
            manager:
              metering:
                podSecurityContext:
                  fsGroup: 65532
                  fsGroupChangePolicy: OnRootMismatch
  - apiVersion: protection.crossplane.io/v1beta1
    kind: Usage
    metadata:
      name: test-cp-usage-release-aks
    spec:
      of:
        kind: KubernetesCluster
      by:
        kind: Release
  - apiVersion: protection.crossplane.io/v1beta1
    kind: Usage
    metadata:
      name: test-cp-usage-vnet-rg
    spec:
      of:
        kind: ResourceGroup
      by:
        kind: VirtualNetwork
---
apiVersion: meta.dev.upbound.io/v1alpha1
kind: CompositionTest
metadata:
  name: backup-enabled
spec:
  compositionPath: apis/ctp/composition.yaml
  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: azure.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        location: eastus
        version: "1.34"
        nodes:
          count: 2
          vmSize: Standard_D2s_v3
        backup:
          enabled: "yes"
          location: mybackup001/uxp-backups
  assertResources:
  - apiVersion: storage.azure.m.upbound.io/v1beta1
    kind: Account
    metadata:
      name: mybackup001
    spec:
      forProvider:
        location: eastus
  - apiVersion: storage.azure.m.upbound.io/v1beta1
    kind: Container
    metadata:
      name: test-cp-backup-container
  - apiVersion: containerservice.azure.m.upbound.io/v1beta1
    kind: KubernetesCluster
    metadata:
      name: test-cp-observe
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-backup-config
    spec:
      forProvider:
        manifest:
          spec:
            objectStorage:
              provider: Azure
              credentials:
                source: InjectedIdentity
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-backup-rbac
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-backup-rbac-binding
---
