# Composition tests for the Azure ControlPlane Python composition.
# Each test renders the composition against a ControlPlane XR fixture and
# asserts that specific composed resources are produced. The cluster/network
# are composed as AKS + Network XRs (configuration-azure-aks / -network).
---
apiVersion: meta.dev.upbound.io/v1alpha1
kind: CompositionTest
metadata:
  name: basic
spec:
  compositionPath: apis/ctp/composition.yaml
  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: azure.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        location: eastus
        version: "1.34"
        nodes:
          count: 2
          vmSize: Standard_D2s_v3
  assertResources:
  - apiVersion: azure.platform.upbound.io/v1alpha1
    kind: Network
    metadata:
      name: test-cp
    spec:
      parameters:
        region: eastus
        addressRange: 10.224.0.0/16
        generalSubnetRange: 10.224.0.0/24
  - apiVersion: azure.platform.upbound.io/v1alpha1
    kind: AKS
    metadata:
      name: test-cp
    spec:
      parameters:
        region: eastus
        version: "1.34"
        nodes:
          count: 2
          instanceType: Standard_D2s_v3
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-uxp
    spec:
      forProvider:
        chart:
          version: "2.2.1-up.1"
        values:
          upbound:
            manager:
              metering:
                podSecurityContext:
                  fsGroup: 65532
                  fsGroupChangePolicy: OnRootMismatch
  # cert-manager is always installed, decoupled from the knative/license gates.
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-certmanager
    spec:
      forProvider:
        chart:
          name: cert-manager
          repository: https://charts.jetstack.io
        namespace: cert-manager
  - apiVersion: protection.crossplane.io/v1beta1
    kind: Usage
    metadata:
      name: test-cp-usage-release-aks
    spec:
      of:
        kind: AKS
      by:
        kind: Release
  - apiVersion: protection.crossplane.io/v1beta1
    kind: Usage
    metadata:
      name: test-cp-usage-aks-network
    spec:
      of:
        kind: Network
      by:
        kind: AKS
---
