spec:
  compositionPath: apis/ctp/composition.yaml
  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: azure.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        location: eastus
        version: "1.34"
        nodes:
          count: 2
          vmSize: Standard_D2s_v3
        k8gb:
          enabled: "yes"
          dnsZone: gslb.example.com
          parentZone: example.com
  assertResources:
  - apiVersion: network.azure.m.upbound.io/v1beta1
    kind: PublicIP
    metadata:
      name: test-cp-k8gb-ip
  # No PublicIP observed -> k8gb_public_ip is empty -> glue must not be populated.
  - apiVersion: azure.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    (status.controlplane.k8gb.glueAddresses == null): true
    (status.controlplane.k8gb.delegationRecord == null): true
