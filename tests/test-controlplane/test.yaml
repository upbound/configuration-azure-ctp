        version: "1.34"
        nodes:
          count: 2
          vmSize: Standard_D2s_v3
        backup:
          enabled: "yes"
          location: mybackup001/uxp-backups
          bucketRegion: westus2
  assertResources:
  # Storage account lives in the DR region (bucketRegion), not the cluster region.
  - apiVersion: storage.azure.m.upbound.io/v1beta1
    kind: Account
    metadata:
      name: mybackup001
    spec:
      forProvider:
        location: westus2
  # The cluster/network stay in the control plane location.
  - apiVersion: azure.platform.upbound.io/v1alpha1
    kind: Network
    metadata:
      name: test-cp
    spec:
      parameters:
        region: eastus
