apiVersion: meta.dev.upbound.io/v1alpha1
kind: CompositionTest
metadata:
  name: backup-enabled
spec:
  compositionPath: apis/ctp/composition.yaml
  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: azure.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        location: eastus
        version: "1.34"
        nodes:
          count: 2
          vmSize: Standard_D2s_v3
        backup:
          enabled: "yes"
          location: mybackup001/uxp-backups
  assertResources:
  - apiVersion: storage.azure.m.upbound.io/v1beta1
    kind: Account
    metadata:
      name: mybackup001
    spec:
      forProvider:
        location: eastus
      # Cloud MRs use a namespaced ProviderConfig (in the XR namespace),
      # matching the AKS/Network building blocks — not ClusterProviderConfig.
      providerConfigRef:
        name: default
        kind: ProviderConfig
  - apiVersion: storage.azure.m.upbound.io/v1beta1
    kind: Container
    metadata:
      name: test-cp-backup-container
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-backup-config
    spec:
      forProvider:
        manifest:
          spec:
            objectStorage:
              provider: Azure
              credentials:
                source: InjectedIdentity
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-backup-rbac
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-backup-rbac-binding
