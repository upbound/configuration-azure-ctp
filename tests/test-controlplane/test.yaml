  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: azure.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
      namespace: platform
    spec:
      parameters:
        id: test-cp
        location: eastus
        version: "1.34"
        nodes:
          count: 2
          vmSize: Standard_D2s_v3
        k8gb:
          enabled: "yes"
          dnsZone: gslb.example.com
          parentZone: example.com
  observedResources:
  - apiVersion: network.azure.m.upbound.io/v1beta1
    kind: PublicIP
    metadata:
      name: test-cp-k8gb-ip
      namespace: platform
      annotations:
        crossplane.io/composition-resource-name: k8gb-ip
    status:
      atProvider:
        ipAddress: 20.1.2.3
        id: /subscriptions/x/resourceGroups/test-cp-rg/providers/Microsoft.Network/publicIPAddresses/test-cp-k8gb-ip
  assertResources:
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-k8gb
      namespace: platform
      annotations:
        crossplane.io/external-name: k8gb
    spec:
      forProvider:
        chart:
          name: k8gb
          repository: https://www.k8gb.io
          version: v0.20.0
        # Helm install target on the child cluster - fixed, not the XR namespace.
        namespace: k8gb
        values:
          k8gb:
            clusterGeoTag: azure-eastus-test-cp
            installLegacyCrds: true
            dnsZones:
            - loadBalancedZone: gslb.example.com
              parentZone: example.com
          extdns:
            enabled: false
          coredns:
            serviceType: LoadBalancer
            servers:
            - zones:
              - zone: .
                use_tcp: false
              port: 5353
              servicePort: 53
              plugins:
              - name: prometheus
                parameters: 0.0.0.0:9153
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-k8gb-coredns
      namespace: platform
    spec:
      managementPolicies:
      - Observe
      forProvider:
        manifest:
          kind: Service
          metadata:
            name: k8gb-coredns
            # In-cluster target namespace - fixed.
            namespace: k8gb
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-envoy-gateway
      namespace: platform
  - apiVersion: protection.crossplane.io/v1beta1
    kind: Usage
    metadata:
      name: test-cp-usage-k8gb-aks
      namespace: platform
    spec:
      of:
        kind: AKS
        resourceRef:
          name: test-cp
          namespace: platform
  - apiVersion: protection.crossplane.io/v1beta1
    kind: Usage
    metadata:
      name: test-cp-usage-k8gb-coredns-aks
      namespace: platform
    spec:
      of:
        kind: AKS
        resourceRef:
          name: test-cp
          namespace: platform
