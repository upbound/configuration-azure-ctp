apiVersion: meta.dev.upbound.io/v1alpha1
kind: CompositionTest
metadata:
  name: with-install-from
spec:
  compositionPath: apis/ctp/composition.yaml
  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: azure.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        location: eastus
        version: "1.34"
        nodes:
          count: 2
          vmSize: Standard_D4s_v3
        backup:
          enabled: "yes"
          location: newcpbackup/uxp-backups
          installFrom:
            location: oldcpbackup/uxp-backups
            name: old-cp-backup-002
  assertResources:
  - apiVersion: storage.azure.m.upbound.io/v1beta1
    kind: Account
    metadata:
      name: newcpbackup
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-backup-config
    spec:
      forProvider:
        manifest:
          spec:
            objectStorage:
              bucket: uxp-backups
              config:
                endpoint: newcpbackup.blob.core.windows.net
