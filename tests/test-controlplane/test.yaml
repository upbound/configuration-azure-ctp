      name: test-cp-upbound-runtime-config
    spec:
      forProvider:
        manifest:
          kind: UpboundRuntimeConfig
          spec:
            capabilities:
            - ProviderVPA
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-uxp
    spec:
      forProvider:
        values:
          upbound:
            manager:
              args:
              - --enable-provider-vpa
