spec:
  compositionPath: apis/ctp/composition.yaml
  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: azure.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        location: eastus
        version: "1.34"
        nodes:
          count: 2
          vmSize: Standard_D2s_v3
        backup:
          enabled: "yes"
          location: mybackup001/uxp-backups
  observedResources:
  - apiVersion: containerservice.azure.m.upbound.io/v1beta1
    kind: KubernetesCluster
    metadata:
      name: test-cp-observe
      namespace: default
      annotations:
        crossplane.io/composition-resource-name: aks-cluster-observe
    spec:
      forProvider:
        location: eastus
    status:
      atProvider:
        oidcIssuerUrl: https://eastus.oic.prod-aks.azure.com/00000000-0000-0000-0000-000000000000/abcdef/
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-uxp
      namespace: default
      annotations:
        crossplane.io/composition-resource-name: uxp-release
    spec:
      forProvider:
        chart:
          name: crossplane
          repository: oci://xpkg.upbound.io/upbound
          version: 2.2.1-up.1
    status:
      atProvider:
        state: deployed
  assertResources:
  - apiVersion: managedidentity.azure.m.upbound.io/v1beta1
    kind: UserAssignedIdentity
    metadata:
      name: test-cp-backup-identity
  - apiVersion: managedidentity.azure.m.upbound.io/v1beta1
    kind: FederatedIdentityCredential
    metadata:
      name: test-cp-backup-federation
    spec:
      forProvider:
        issuer: https://eastus.oic.prod-aks.azure.com/00000000-0000-0000-0000-000000000000/abcdef/
        subject: system:serviceaccount:crossplane-system:upbound-controller-manager
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-backup-sa
    spec:
      forProvider:
        manifest:
          kind: ServiceAccount
          metadata:
            name: upbound-controller-manager
            namespace: crossplane-system
  - apiVersion: kubernetes.m.crossplane.io/v1alpha1
    kind: Object
    metadata:
      name: test-cp-controller-restart
    spec:
      forProvider:
        manifest:
          kind: Deployment
          metadata:
            name: upbound-controller-manager
            namespace: crossplane-system
