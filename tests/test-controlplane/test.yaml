        oidcUrl: https://eastus.oic.prod-aks.azure.com/00000000-0000-0000-0000-000000000000/abcdef/
        clusterName: test-cp-aks
        nodes:
          vmSize: Standard_D2s_v3
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-uxp
      namespace: default
      annotations:
        crossplane.io/composition-resource-name: uxp-release
    spec:
      forProvider:
        chart:
          name: crossplane
