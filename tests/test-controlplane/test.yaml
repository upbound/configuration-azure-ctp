apiVersion: meta.dev.upbound.io/v1alpha1
kind: CompositionTest
metadata:
  name: vm-size-drift
spec:
  compositionPath: apis/ctp/composition.yaml
  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: azure.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        location: eastus
        version: "1.34"
        nodes:
          count: 2
          vmSize: Standard_D2s_v3
  observedResources:
  # Running node-pool vmSize (Standard_D4s_v3) differs from the desired
  # Standard_D2s_v3. It is read from the composed AKS XR's status.aks.nodes,
  # driving the NodePoolVmSizeImmutable condition and status.controlplane.nodes.
  # currentVmSize. clusterName is surfaced from status.aks.clusterName.
  - apiVersion: azure.platform.upbound.io/v1alpha1
    kind: AKS
    metadata:
      name: test-cp
      namespace: default
      annotations:
        crossplane.io/composition-resource-name: aks
    status:
      aks:
        clusterName: test-cp-aks
        nodes:
          vmSize: Standard_D4s_v3
  assertResources:
  # The composition renders normally while reporting the drift on status; the
  # AKS XR is still composed with the desired vmSize.
  - apiVersion: azure.platform.upbound.io/v1alpha1
    kind: AKS
    metadata:
      name: test-cp
    spec:
      parameters:
        nodes:
          instanceType: Standard_D2s_v3
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-uxp
  # Cluster name and the running (drifted) vmSize are surfaced on the XR status.
  - apiVersion: azure.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    status:
      controlplane:
        clusterName: test-cp-aks
        nodes:
          currentVmSize: Standard_D4s_v3
---
apiVersion: meta.dev.upbound.io/v1alpha1
kind: CompositionTest
metadata:
  name: with-ingress-nginx
spec:
  compositionPath: apis/ctp/composition.yaml
  xrdPath: apis/ctp/definition.yaml
  validate: true
  timeoutSeconds: 60
  xr:
    apiVersion: azure.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: test-cp
    spec:
      parameters:
        id: test-cp
        location: eastus
        version: "1.34"
        nodes:
          count: 2
          vmSize: Standard_D2s_v3
        argocd:
          enabled: "yes"
  assertResources:
  # nginx-ingress installs because an add-on that needs an Ingress (argocd) is
  # enabled; on baseline control planes it is not rendered.
  - apiVersion: helm.m.crossplane.io/v1beta1
    kind: Release
    metadata:
      name: test-cp-ingress-nginx
    spec:
      forProvider:
        chart:
          name: ingress-nginx
          repository: https://kubernetes.github.io/ingress-nginx
        namespace: ingress-nginx
