        version: "1.34"
        nodes:
          count: 2
          vmSize: Standard_D2s_v3
        network:
          addressRange: 172.20.0.0/16
          generalSubnetRange: 172.20.1.0/24
  assertResources:
  # Custom network params pass straight through to the Network XR.
  - apiVersion: azure.platform.upbound.io/v1alpha1
    kind: Network
    metadata:
      name: test-cp
    spec:
      parameters:
        region: westeurope
