# E2E test: Azure ControlPlane with backup + enterprise license.
# Spins up a real AKS cluster via the configuration-azure-ctp composition,
# installs UXP, wires Workload Identity backup, and applies an enterprise
# license.
# Requires:
#   - An Azure ProviderConfig named "default" with valid credentials
#     (created automatically from initResources, but the referenced Secret
#     "azure-creds" in crossplane-system must already exist on the test
#     control plane with key "creds" containing the Azure service-principal
#     JSON).
#   - A Secret named "uxp-license" in namespace "default" whose key
#     "license.json" contains the UXP license JSON.
#   - Sufficient Azure quotas for one Standard_D2s_v3 two-node AKS cluster
#     in eastus.
#
# Expected runtime: 25-45 minutes (AKS provisioning + UXP install + Workload
# Identity wiring).
apiVersion: meta.dev.upbound.io/v1alpha1
kind: E2ETest
metadata:
  name: controlplane-with-backup-and-license
spec:
  crossplane:
    autoUpgrade:
      channel: Stable
  defaultConditions:
  - Ready
  timeoutSeconds: 3600
  cleanupTimeoutSeconds: 1200
  initResources:
  - apiVersion: azure.upbound.io/v1beta1
    kind: ProviderConfig
    metadata:
      name: default
    spec:
      credentials:
        source: Secret
        secretRef:
          namespace: crossplane-system
          name: azure-creds
          key: creds
  manifests:
  - apiVersion: azure.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: e2e-test-cp
    spec:
      parameters:
        id: e2etestcp
        location: eastus
        version: "1.34"
        nodes:
          count: 2
          vmSize: Standard_D2s_v3
        backup:
          enabled: "yes"
          location: e2etestcpbackup/uxp-backups
        license:
          secretRef:
            name: uxp-license
            namespace: default
  skipDelete: false
