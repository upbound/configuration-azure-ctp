# Single comprehensive E2E test for configuration-azure-ctp.
#
# Spins up a real AKS cluster via the composition and exercises the full stack in
# one run: UXP + Workload-Identity backup + the k8gb producer (operator + CoreDNS
# via a native Azure Standard LB) + ArgoCD (UI Gateway/HTTPRoute + app-of-apps), which also
# pulls in cert-manager (always-on) and the Envoy Gateway data plane.
#
# WHY ONE TEST: e2e auth uses `source: Upbound` workload-identity federation to the
# shared AAD app `dare-oidc-provider` (appId bcf40abd-...). Azure federates the
# token to a federated identity credential (FIC) whose subject embeds THIS test's
# name:
#     mcp:solutions/configuration-azure-ctp-uptest-controlplane:provider:provider-azure
# The app is at its 20-FIC cap, so we keep a SINGLE e2e test named `controlplane`
# and register exactly one matching FIC (issuer https://proidc.upbound.io,
# audience api://AzureADTokenExchange). Adding more e2e tests would need more FICs
# — do not rename this test or split it without registering the new subject(s).
#
# Credentials: the Azure ProviderConfig "default" uses Upbound-injected identity
# (clientID/tenantID/subscriptionID = the shared solutions e2e Azure identity, the
# same values used by configuration-azure-aks/-network). No pre-provisioned Secret
# is required on the ephemeral test control plane.
#
# What this asserts: the ControlPlane XR reaches Ready=True. Because
# function-auto-ready aggregates every composed resource, Ready=True implies UXP,
# the backup chain + Workload Identity, and every add-on Release/Object came up
# cleanly. The k8gb CoreDNS endpoint is surfaced on
# status.controlplane.k8gb.coreDNSEndpoint (verify non-empty manually — E2ETest
# cannot assert arbitrary status fields).
#
# Scope: installation only. It does NOT test DNS failover — nothing writes the NS
# delegation yet (FleetGslb is a separate workstream). No license is supplied; the
# backup wiring and add-ons need none. CoreDNS serving TCP+UDP:53 on one Service
# relies on the AKS MixedProtocolLBService gate (GA/on in supported AKS).
#
# Requires Azure quota for one Standard_D2s_v3 two-node AKS cluster plus the load
# balancers the add-ons provision. Expected runtime: 40-70 minutes.
apiVersion: meta.dev.upbound.io/v1alpha1
kind: E2ETest
metadata:
  name: controlplane
spec:
  crossplane:
    autoUpgrade:
      channel: Stable
  defaultConditions:
  - Ready
  timeoutSeconds: 5400
  cleanupTimeoutSeconds: 1800
  extraResources:
  - apiVersion: azure.m.upbound.io/v1beta1
    kind: ProviderConfig
    metadata:
      name: default
      namespace: default
    spec:
      credentials:
        source: Upbound
      clientID: bcf40abd-283c-494b-b186-03d6c864be51
      tenantID: b9925bc4-8383-4c37-b9d2-fa456d1bb1c7
      subscriptionID: 038f2b7c-3265-43b8-8624-c9ad5da610a8
  manifests:
  - apiVersion: azure.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: e2e-test-cp
    spec:
      parameters:
        id: e2etestcp
        location: eastus
        version: "1.34"
        nodes:
          count: 2
          vmSize: Standard_D2s_v3
        backup:
          enabled: "yes"
          location: e2etestcpbackup/uxp-backups
        k8gb:
          enabled: "yes"
          dnsZone: gslb.example.com
          parentZone: example.com
          strategy: failover
        argocd:
          enabled: "yes"
          hostname: argocd.example.com
          url: https://github.com/argoproj/argocd-example-apps
  skipDelete: false
