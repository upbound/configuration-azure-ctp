# E2E test: Azure ControlPlane with the k8gb + ArgoCD add-ons enabled.
# Spins up a real AKS cluster via the configuration-azure-ctp composition,
# installs UXP, and then the full add-on stack: cert-manager (always-on),
# nginx-ingress, k8gb (operator + CoreDNS exposed via an Azure Standard LB), and
# ArgoCD (UI Ingress + root app-of-apps).
#
# Credentials: the Azure ProviderConfig "default" uses Upbound-injected identity
# federated to the solutions e2e UserAssignedIdentity, so no pre-provisioned
# Secret is required on the ephemeral test control plane. The
# clientID/tenantID/subscriptionID below are the shared Upbound solutions e2e
# Azure identity, the same values used by configuration-azure-aks/-network and
# the controlplane-with-backup e2e test.
#
# What this asserts: the ControlPlane XR reaches Ready=True. Because
# function-auto-ready aggregates every composed resource, Ready=True implies all
# add-on Releases reached state=deployed and every add-on Object was applied —
# i.e. the whole add-on stack installs cleanly.
#
# Scope: this is an *installation* e2e. It does NOT test DNS failover — nothing
# writes the NS delegation yet (FleetGslb is a separate workstream), so GSLB is
# not functional end-to-end. The Azure Standard LB endpoint is surfaced on
# status.controlplane.k8gb.coreDNSEndpoint; verify it is non-empty manually
# (E2ETest cannot assert arbitrary status fields). No license is supplied — the
# add-ons here need none.
#
# NOTE: CoreDNS serving both TCP and UDP on :53 in one Service relies on the
# Kubernetes MixedProtocolLBService gate (GA/on in supported AKS); verify on the
# target AKS version if the CoreDNS Service does not go Ready.
#
# Requires sufficient Azure quotas for one Standard_D2s_v3 two-node AKS cluster
# plus the load balancers the add-ons provision. Expected runtime: 40-70 minutes.
apiVersion: meta.dev.upbound.io/v1alpha1
kind: E2ETest
metadata:
  name: controlplane-with-addons
spec:
  crossplane:
    autoUpgrade:
      channel: Stable
  defaultConditions:
  - Ready
  timeoutSeconds: 5400
  cleanupTimeoutSeconds: 1800
  extraResources:
  - apiVersion: azure.m.upbound.io/v1beta1
    kind: ProviderConfig
    metadata:
      name: default
      namespace: default
    spec:
      credentials:
        source: Upbound
      clientID: bcf40abd-283c-494b-b186-03d6c864be51
      tenantID: b9925bc4-8383-4c37-b9d2-fa456d1bb1c7
      subscriptionID: 038f2b7c-3265-43b8-8624-c9ad5da610a8
  manifests:
  - apiVersion: azure.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: e2e-addons-cp
    spec:
      parameters:
        id: e2eaddonscp
        location: eastus
        version: "1.34"
        nodes:
          count: 2
          vmSize: Standard_D2s_v3
        k8gb:
          enabled: "yes"
          dnsZone: gslb.example.com
          parentZone: example.com
          strategy: failover
        argocd:
          enabled: "yes"
          hostname: argocd.example.com
          url: https://github.com/argoproj/argocd-example-apps
  skipDelete: false
