apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: controlplanes.azure.platform.upbound.io
spec:
  group: azure.platform.upbound.io
  names:
    categories:
    - crossplane
    kind: ControlPlane
    plural: controlplanes
  scope: Cluster
  versions:
  - name: v1alpha1
    referenceable: true
    schema:
      openAPIV3Schema:
        description: ControlPlane is the Schema for creating Azure AKS clusters configured as Upbound control planes with optional UXP backup.
        properties:
          spec:
            description: ControlPlaneSpec defines the desired state of ControlPlane.
            properties:
              parameters:
                type: object
                description: ControlPlane configuration parameters.
                properties:
                  id:
                    type: string
                    description: ID of this ControlPlane that other objects will use to refer to it.
                  location:
                    type: string
                    description: Azure region where the resources will be created (e.g. "eastus", "westus2").
                  providerConfigName:
                    description: Crossplane ProviderConfig to use for provisioning these resources.
                    type: string
                    default: default
                  version:
                    description: >-
                      Kubernetes version for the AKS cluster. Constrained to the
                      range the underlying configuration-azure-aks AKS XRD
                      accepts (1.32-1.35). 1.31 and earlier require AKS
                      Long-Term Support (Premium tier). Run `az aks get-versions
                      --location <loc> -o table` to check what's available in
                      your target region.
                    type: string
                    enum:
                    - "1.35"
                    - "1.34"
                    - "1.33"
                    - "1.32"
                    default: "1.34"
                  nodes:
                    type: object
                    description: AKS node pool configuration parameters.
                    properties:
                      count:
                        type: integer
                        description: Desired node count, from 1 to 100.
                      vmSize:
                        type: string
                        description: VM size for the AKS node pool (e.g. "Standard_D2s_v3").
                        default: Standard_D2s_v3
                      availabilityZones:
                        type: array
                        description: >-
                          Optional list of availability zones to spread the default
                          node pool across (e.g. ["1", "2", "3"]). When omitted, no
                          zones are set. Immutable once set.
                        items:
                          type: string
                    required:
                    - count
                    - vmSize
                  network:
                    type: object
                    description: >-
                      Virtual network topology for the control plane. Optional;
                      values are passed through to the underlying
                      configuration-azure-network Network XR. Azure AKS spreads
                      nodes across availability zones at the node-pool level, so
                      a single general subnet is used (no per-AZ subnets).
                    properties:
                      addressRange:
                        type: string
                        description: CIDR block for the virtual network.
                        default: "10.0.0.0/16"
                      generalSubnetRange:
                        type: string
                        description: CIDR block for the general (AKS) subnet.
                        default: "10.0.1.0/24"
                  uxp:
                    type: object
                    description: UXP installation configuration.
                    properties:
                      version:
                        type: string
                        description: UXP Helm chart version to install (e.g. 2.2.1-up.1).
                        default: "2.2.1-up.1"
                    default:
                      version: "2.2.1-up.1"
                  backup:
                    type: object
                    description: UXP backup configuration using Azure Workload Identity.
                    properties:
                      enabled:
                        type: string
                        description: Enable UXP backup for this control plane ("yes" or "no").
                        default: "no"
                        enum: ["yes", "no"]
                      location:
                        type: string
                        description: >-
                          Azure Blob container reference for backup storage in the form
                          "<storage-account-name>/<container-name>". The storage account and
                          container are created if missing and never deleted by Crossplane.
                        pattern: '^[a-z0-9]+/[a-z0-9-]+$'
                      bucketRegion:
                        type: string
                        description: >-
                          Azure region for the backup storage account. Defaults to the
                          control plane's location. Set to a different region than the cluster
                          for cross-region disaster recovery, so backups survive a full outage
                          of the cluster's region.
                      schedule:
                        type: string
                        description: >-
                          Backup schedule. Accepts named shortcuts (@hourly, @daily, @weekly),
                          standard 5-field cron expressions (e.g. "0 0/4 * * *", "0/15 * * * 1-5"),
                          or duration intervals (e.g. "@every 1h30m10s"). When set, a BackupSchedule
                          resource is created on the control plane's AKS cluster.
                      installFrom:
                        type: object
                        description: >-
                          Restore UXP state from an existing backup during initial provisioning.
                          Applied once at bootstrap — ignored on subsequent reconciles.
                          Use this when changing node VM sizes: provision a new ControlPlane
                          with the desired vmSize and set installFrom to restore state from
                          the existing control plane's backup.
                        properties:
                          location:
                            type: string
                            description: >-
                              Azure Blob container reference containing the source backup, in
                              the form "<storage-account-name>/<container-name>".
                            pattern: '^[a-z0-9]+/[a-z0-9-]+$'
                          name:
                            type: string
                            description: Name of the backup to restore from (e.g. "my-backup-002").
                        required:
                        - location
                        - name
                  license:
                    type: object
                    description: UXP enterprise license configuration. When set, provisions a license on the control plane's UXP instance.
                    properties:
                      secretRef:
                        type: object
                        description: Reference to a Secret on the management cluster containing the UXP license JSON under the key "license".
                        properties:
                          name:
                            type: string
                            description: Name of the secret containing the UXP license JSON.
                          namespace:
                            type: string
                            description: Namespace of the secret.
                            default: default
                        required:
                        - name
                    required:
                    - secretRef
                  providerVerticalPodAutoscaling:
                    type: object
                    description: >-
                      Enable Vertical Pod Autoscaling for UXP providers. Requires Metrics Server
                      and VPA v1.4+ pre-installed on the AKS cluster. Needs a Standard or higher license.
                    properties:
                      enabled:
                        type: string
                        description: Enable provider VPA ("yes" or "no").
                        default: "no"
                        enum: ["yes", "no"]
                      minCpu:
                        type: string
                        description: Minimum CPU allowed for provider containers (e.g. "100m").
                      maxCpu:
                        type: string
                        description: Maximum CPU allowed for provider containers (e.g. "2").
                      minMemory:
                        type: string
                        description: Minimum memory allowed for provider containers (e.g. "100Mi").
                      maxMemory:
                        type: string
                        description: Maximum memory allowed for provider containers (e.g. "4000Mi").
                  knative:
                    type: object
                    description: >-
                      Enable Knative scale-to-zero for UXP functions. When enabled, cert-manager and
                      Knative Serving are installed automatically on the AKS cluster. Needs a Standard or higher license.
                    properties:
                      enabled:
                        type: string
                        description: Enable Knative function runtime ("yes" or "no").
                        default: "no"
                        enum: ["yes", "no"]
                  managementPolicies:
                    description: ManagementPolicies for resources. Defaults to ["*"] which includes all operations.
                    type: array
                    items:
                      type: string
                      enum:
                      - "*"
                      - Create
                      - Observe
                      - Update
                      - Delete
                      - LateInitialize
                    default:
                    - "*"
                required:
                - id
                - location
                - nodes
            required:
            - parameters
            type: object
          status:
            description: A Status represents the observed state.
            properties:
              controlplane:
                description: Status information for the control plane.
                type: object
                x-kubernetes-preserve-unknown-fields: true
                properties:
                  created:
                    description: Creation timestamp of this ControlPlane resource (RFC 3339).
                    type: string
                  clusterName:
                    description: Name of the AKS cluster backing this control plane, sourced from the composed AKS XR status.
                    type: string
                  uxp:
                    description: UXP installation status on the AKS cluster.
                    type: object
                    properties:
                      version:
                        description: UXP Helm chart version deployed on this control plane.
                        type: string
                      ready:
                        description: True when the UXP Helm Release is Ready (all UXP pods running).
                        type: boolean
                  backup:
                    description: Backup status — populated once the AKS cluster is ready and backup is enabled.
                    type: object
                    properties:
                      enabled:
                        description: Whether backup is enabled for this control plane.
                        type: string
                      containerRef:
                        description: Storage account/container reference configured as the backup destination.
                        type: string
                      identityClientId:
                        description: Client ID of the UserAssignedIdentity created for the UXP backup controller.
                        type: string
                      lastBackupTime:
                        description: Timestamp of the most recent scheduled backup run, sourced from BackupSchedule status.
                        type: string
                  resources:
                    description: Managed resource health summary across all composed resources.
                    type: object
                    properties:
                      total:
                        description: Total number of composed managed resources.
                        type: integer
                      synced:
                        description: Number of composed resources with Synced=True.
                        type: integer
                      ready:
                        description: Number of composed resources with Ready=True.
                        type: integer
                      syncedAndReady:
                        description: Number of composed resources with both Synced=True and Ready=True.
                        type: integer
                  knative:
                    description: Knative feature status.
                    type: object
                    properties:
                      enabled:
                        description: Whether Knative function runtime is enabled.
                        type: string
                  providerVerticalPodAutoscaling:
                    description: Provider VPA feature status.
                    type: object
                    properties:
                      enabled:
                        description: Whether provider Vertical Pod Autoscaling is enabled.
                        type: string
                  nodes:
                    description: Node pool status.
                    type: object
                    properties:
                      vmSize:
                        description: Desired VM size for AKS worker nodes.
                        type: string
                      currentVmSize:
                        description: >-
                          Currently running VM size observed from Azure. Differs from
                          vmSize when an in-place change was attempted — see the
                          NodePoolVmSizeImmutable condition for remediation guidance.
                        type: string
            type: object
        required:
        - spec
        type: object
    served: true
